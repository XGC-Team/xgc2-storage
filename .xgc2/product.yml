schema: xgc2.product.v1
id: xgc2-storage
name: XGC2 Storage
version: 0.2.0-1
kind: toolchain-apt
summary: Embeddable SQLite owner for Core (typed Go API) with an optional XRPC document exposure and daemon.
apt:
  distribution: focal,jammy,noble
  install:
  - xgc2-storage
  packages:
  - xgc2-storage
  package_architectures:
    xgc2-storage: [amd64, arm64]
  depends: [ca-certificates]
usage:
  install: sudo apt install xgc2-storage
  smoke_test: xgc2-storage --help
  notes: >-
    Core embeds the library and needs no daemon. The xgc2-storage daemon is the
    optional XRPC exposure of the same owner (the Lichtblick launcher uses it); its
    deployment grants select database, manifest, owner credentials and sockets.
    No systemd autostart, database root defaults or Core/ROS dependency. The Agent
    uses no Storage. Static Go builds embed the shared XRPC implementation; the
    build receipt records its source identity.
ownership:
  paths:
  - /usr/bin/xgc2-storage
  - /usr/bin/xgc2-storage-admin
  - /usr/share/xgc2-storage/contracts
  - /usr/share/xgc2-storage/schemas
release:
  repository: XGC-Team/xgc2-storage
  ref: main
  requires: []
  dependency_policy: {}
  apt_versions:
    focal: 0.2.0-1~focal
    jammy: 0.2.0-1~jammy
    noble: 0.2.0-1~noble
